[package]
name = "rstared"
version = "0.13.1"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Simple decorator that adds rstar::RTree to arbitrary collections."
repository = "https://github.com/mikwielgus/rstared"
documentation = "https://docs.rs/rstared"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["rtree", "no_std"]
categories = ["data-structures", "game-development", "gui", "no-std", "rust-patterns"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
maplike = { version = "0.13.5", features = ["rstar"], default-features = false }
rstar = "0.13"
undoredo = { version = "0.13", features = ["rstar"], default-features = false, optional = true }

[dev-dependencies]
maplike = { version = "0.13.5", features = ["rstar", "stable-vec", "thunderdome"] }
rand = "0.9"
stable-vec = "0.4"
thunderdome = "0.6"

# Use scraped examples.
[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "basic_usage"
doc-scrape-examples = true

[[example]]
name = "undoredo"
required-features = ["undoredo"]
doc-scrape-examples = true

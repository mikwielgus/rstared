[package]
name = "rstared"
version = "0.14.2"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Simple decorator that adds rstar::RTree to arbitrary collections."
repository = "https://github.com/mikwielgus/rstared"
documentation = "https://docs.rs/rstared"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["rtree", "no_std"]
categories = ["data-structures", "game-development", "gui", "no-std", "rust-patterns"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["std"]
std = ["maplike/std"]
arrayvec = ["maplike/arrayvec"]
bidimap = ["maplike/bidimap"]
geo = ["maplike/geo"]
indexmap = ["maplike/indexmap"]
smallvec = ["maplike/smallvec"]
stable-vec = ["maplike/stable-vec"]
thunderdome = ["maplike/thunderdome"]
tinyvec = ["maplike/tinyvec"]
undoredo = ["dep:undoredo"]

[dependencies]
maplike = { version = "0.14", features = ["alloc", "rstar"], default-features = false }
rstar = "0.13"
undoredo = { version = "0.14", features = ["rstar"], default-features = false, optional = true }

[dev-dependencies]
geo-types = { version = "0.7", features = ["rstar_0_13"] }
rand = "0.9"
stable-vec = "0.4"
thunderdome = "0.6"

# Use scraped examples.
[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "hashmap"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "multipolygon"
required-features = ["geo"]
doc-scrape-examples = true

[[example]]
name = "thunderdome"
required-features = ["thunderdome"]
doc-scrape-examples = true

[[example]]
name = "undoredo"
required-features = ["undoredo", "std"]
doc-scrape-examples = true

[[example]]
name = "vec"
doc-scrape-examples = true

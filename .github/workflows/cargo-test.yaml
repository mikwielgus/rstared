name: cargo-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Test examples, tests, docs for default feature flags set, for no feature flags, and for each feature flag
        run: |
          cargo test --workspace --examples --tests
          cargo test --workspace --doc
          cargo test --workspace --no-default-features --examples --tests
          cargo test --workspace --no-default-features --doc
          cargo hack test --workspace --optional-deps --each-feature --examples --tests
          cargo hack test --workspace --optional-deps --each-feature --doc

shared-version = true
pre-release-commit-message = "Release version {{version}}"
tag-name = "{{version}}"
pre-release-replacements = [
  { file = "README.md", search = 'rstared = \{ version = "[^"]+"([^}]*)\}', replace = '{{crate_name}} = { version = "{{version}}"$1}' },
]

steps:
  check_formatting:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - cargo install cargo-llvm-cov
      - cargo llvm-cov --all-features --tests --examples --fail-under-lines 75
    when:
      event: [pull_request, push, tag]
